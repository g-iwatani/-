name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 同じ branch / PR の連投があれば古い run はキャンセル (CI 待ち時間の節約)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build (next build)
        # OpenNext の Cloudflare ビルドはここでは走らせず、PR では純 Next.js ビルドだけで
        # 開発高速化。本番デプロイは deploy.yml で cf:build を走らせる。
        run: npm run build
