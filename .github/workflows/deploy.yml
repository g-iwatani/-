name: Deploy to Cloudflare Workers

on:
  push:
    # 現状リポジトリのデフォルトブランチは claude/build-new-website-3AHnd。
    # 将来 main を作って trunk にした際は branches: [main] に絞る。
    branches: [main, "claude/build-new-website-3AHnd"]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: cf:deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: OpenNext Cloudflare build
        run: npm run cf:build

      - name: Wrangler deploy
        # cloudflare/wrangler-action はトークン経由で Cloudflare にデプロイする。
        # CLOUDFLARE_API_TOKEN は GitHub repo secrets に "Edit Cloudflare Workers"
        # 権限のトークンを登録しておく (ユーザー作業)。
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: app
          # OpenNext は .open-next/worker.js をエントリにするため wrangler.jsonc に
          # 既に記述されている。コマンド省略で deploy がそのまま走る。
          command: deploy
