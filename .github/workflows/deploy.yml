name: Deploy to Cloudflare Workers

on:
  push:
    # 現状リポジトリのデフォルトブランチは claude/build-new-website-3AHnd。
    # 将来 main を作って trunk にした際は branches: [main] に絞る。
    branches: [main, "claude/build-new-website-3AHnd"]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: cf:deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: OpenNext Cloudflare build
        run: npm run cf:build

      - name: Wrangler deploy
        # cloudflare/wrangler-action はトークン経由で Cloudflare にデプロイする。
        # 必須 secret:
        #   - CLOUDFLARE_API_TOKEN: "Edit Cloudflare Workers" 権限のトークン
        #   - CLOUDFLARE_ACCOUNT_ID: 複数アカウント所持時 or auto-detect 失敗時に必須
        # どちらかが欠けていると generic exit code 1 で落ちるので両方登録推奨。
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: app
          command: deploy
