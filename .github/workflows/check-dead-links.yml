name: Check dead links

on:
  # 毎週日曜 18:00 UTC = 月曜 03:00 JST
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  scan:
    name: scan + report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run dead link check
        id: check
        # 標準出力を Markdown でキャプチャ。死リンクが 1 件もなければ空ボディ扱いで Issue 化スキップ。
        run: |
          mkdir -p /tmp/dead
          node scripts/check-dead-links.mjs > /tmp/dead/report.md
          # 「問題あり: 0」 なら全成功とみなす
          if grep -q "^問題あり: 0$" /tmp/dead/report.md; then
            echo "has_issues=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_issues=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dead-link-report
          path: /tmp/dead/report.md
          retention-days: 14

      - name: Open issue with the report
        if: steps.check.outputs.has_issues == 'true'
        uses: peter-evans/create-issue-from-file@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "[bot] 死リンク検出: ${{ github.run_id }}"
          content-filepath: /tmp/dead/report.md
          labels: automation,dead-links
